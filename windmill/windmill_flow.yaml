      summary: Recheck-agent
    - id: wg
      value:
        lock: |
          # py: 3.12
        type: rawscript
        content: |-
          def main(correct, incorrect, recheck_results):
              """
              correct:
                  Dict from Parsing Script

              incorrect:
                  List[str]

              recheck_results:
                  List[dict] -> output["results"] from Recheck Agent

              Returns:
              {
                  "Final_Verdict": "outlier" | "not_outlier",
                  "Reason": "..."
              }
              """

              PRODUCT_AGENTS = [
                  "Title vs MCAT Agent",
                  "ISQ vs MCAT Agent",
                  "Title ISQ Agent",
                  "Inter ISQ Agent"
              ]

              agent_status = {}

              # ------------------------------------------
              # 1. Read statuses from Parsing Script (Correct)
              # ------------------------------------------
              if isinstance(correct, dict):
                  for agent in PRODUCT_AGENTS:
                      obj = correct.get(agent)

                      if isinstance(obj, dict):
                          status = obj.get("status")

                          if status:
                              agent_status[agent] = status

              # ------------------------------------------
              # 2. Create lookup for Recheck Agent results
              # ------------------------------------------
              recheck_lookup = {}

              if recheck_results:
                  for item in recheck_results:
                      if not isinstance(item, dict):
                          continue

                      name = item.get("agent") or item.get("Agent")
                      status = item.get("status")

                      if name and status:
                          recheck_lookup[name] = status

              # ------------------------------------------
              # 3. Override status for incorrect agents
              # ------------------------------------------
              if incorrect:
                  for agent in incorrect:

                      if agent not in PRODUCT_AGENTS:
                          continue

                      # Use Recheck result if available
                      if agent in recheck_lookup:
                          agent_status[agent] = recheck_lookup[agent]

                      # If Recheck did not return anything,
                      # keep it as outlier.
                      else:
                          agent_status[agent] = "outlier"

              # ------------------------------------------
              # 4. Final Decision
              # ------------------------------------------
              failed_agents = [
                  agent
                  for agent, status in agent_status.items()
                  if status == "outlier"
              ]

              if failed_agents:
                  return {
                      "Final_Verdict": "outlier",
                      "Reason": f"{', '.join(failed_agents)} returned outlier."
                  }

              return {
                  "Final_Verdict": "not_outlier",
                  "Reason": "All product validation agents are correct."
              }
        language: python3
        input_transforms:
          correct:
            expr: results.w.correct
            type: javascript
          incorrect:
            expr: results.w.incorrect
            type: javascript
          recheck_results:
            expr: results.y.output.results
            type: javascript
