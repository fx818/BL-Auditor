            header = list(row_data.keys())
            row = [str(v) if v is not None else "" for v in row_data.values()]
            IST = timezone(timedelta(hours=5, minutes=30))
            sheet_name = datetime.now(IST).strftime("%Y-%m-%d")
            payload = {"header": header, "rows": [row], "sheet_name": sheet_name}
            with httpx.Client(follow_redirects=True, timeout=30) as client:
                resp = client.post(GOOGLE_SHEETS_WEBHOOK_URL, json=payload)
                resp.raise_for_status()
            return {"status": "error_logged", "offer_id": offer_id}
