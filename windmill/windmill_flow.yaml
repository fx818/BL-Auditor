        def main(offer_id, error):
            err_msg = error.get("message", str(error)) if isinstance(error, dict) else str(error)
            row_data = {
                "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S"),
                "job_id": "WindMillRun",
                "offer_id": offer_id,
                "_status": "error",
