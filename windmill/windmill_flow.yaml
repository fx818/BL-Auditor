        type: rawscript
        content: |-
          import httpx
          import json
          import math
          from datetime import datetime, timezone, timedelta

          GOOGLE_SHEETS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbz6oSuewUdaRhdb8j1EkzYDSRBwyzND7JDLDt1WnPXF7yT6i004TTu3FLl96MK_YCKydQ/exec"

          COLUMN_ORDER = [
              "timestamp", "job_id", "offer_id", "_status", "_error",
              "Decision Verdict", "Decision Reason",
              "Retail_Agent_classification", "Inter_ISQ_Agent_status", "Inter_ISQ_Agent_reason",
              "Title_ISQ_Agent_status", "Title_ISQ_Agent_reason",
              "ISQ_vs_MCAT_Agent_status", "ISQ_vs_MCAT_Agent_reason",
              "Buyer_Viewed_Agent_status", "Title_vs_MCAT_Agent_status",
              "BL_Profile_Agent_status", "BL_Profile_Agent_reason",
              "Description_Agent_status", "Retail_Agent_reason",
              "additional_data_pns", "Inter_ISQ_Agent_source", "Title_ISQ_Agent_source",
              "Description_Agent_reason", "ISQ_vs_MCAT_Agent_source",
              "Buyer_Viewed_Agent_reason", "Title_vs_MCAT_Agent_reason", "Title_vs_MCAT_Agent_source",
              "Profile_Validity_Agent_valid", "Profile_Validity_Agent_reasons",
              "Buyer_Viewed_Agent_vs_CSL_reason", "Buyer_Viewed_Agent_vs_CSL_status",
              "Title_ISQ_Agent_before_recheck_reason", "Title_ISQ_Agent_before_recheck_status",
              "Inter_ISQ_Agent_before_recheck_status", "Inter_ISQ_Agent_before_recheck_reason",
              "Title_vs_MCAT_Agent_before_recheck_status", "Title_vs_MCAT_Agent_before_recheck_reason",
              "ISQ_vs_MCAT_Agent_before_recheck_status", "ISQ_vs_MCAT_Agent_before_recheck_reason",
          ]

          def flatten_value(v):
              if v is None:
                  return ""
              if isinstance(v, bool):
                  return str(v)
              if isinstance(v, float) and (math.isnan(v) or math.isinf(v)):
                  return ""
              if isinstance(v, (int, float)):
                  return v
              if isinstance(v, (dict, list)):
                  return json.dumps(v, ensure_ascii=False)
              try:
                  return str(v)
              except Exception:
                  return ""

          def main(structured_output):
              if structured_output is None:
                  structured_output = {"_status": "partial_failure", "_error": "upstream step (u) returned None"}

              if isinstance(structured_output, str):
                  try:
                      structured_output = json.loads(structured_output)
                  except json.JSONDecodeError:
                      raise ValueError(f"structured_output is a non-JSON string: {structured_output[:200]}")

              if not isinstance(structured_output, dict):
                  raise TypeError(f"Expected dict, got {type(structured_output).__name__}: {str(structured_output)[:200]}")

              if "error" in structured_output and len(structured_output) == 1:
                  raise RuntimeError(f"Upstream step returned an error: {structured_output['error']}")

              structured_output["timestamp"] = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S")
              structured_output["job_id"] = "WindMillRun"

              known = set(COLUMN_ORDER)
              extra = [k for k in structured_output if k not in known]
              ordered_keys = COLUMN_ORDER + extra
              IST = timezone(timedelta(hours=5, minutes=30))
              sheet_name = datetime.now(IST).strftime("%Y-%m-%d")
              header = ordered_keys
              row = [flatten_value(structured_output.get(k)) for k in ordered_keys]

              payload = {"header": header, "rows": [row], "sheet_name": sheet_name}

              try:
                  with httpx.Client(follow_redirects=True, timeout=30) as client:
                      resp = client.post(GOOGLE_SHEETS_WEBHOOK_URL, json=payload)
                      resp.raise_for_status()
              except httpx.TimeoutException:
                  raise RuntimeError("Google Sheets webhook timed out after 30s")
              except httpx.HTTPStatusError as e:
                  raise RuntimeError(f"Webhook returned HTTP {e.response.status_code}: {e.response.text[:300]}")
              except httpx.RequestError as e:
                  raise RuntimeError(f"Network error reaching webhook: {e}")

              body = resp.text.strip()
              if "<html" in body.lower():
                  raise RuntimeError(f"Apps Script returned an error page: {body[:300]}")

              try:
                  result = json.loads(body)
              except json.JSONDecodeError:
                  raise RuntimeError(f"Apps Script returned non-JSON: {body[:300]}")

              if not result.get("success"):
                  raise RuntimeError(f"Apps Script reported failure: {result}")

              return structured_output
        language: python3
        input_transforms:
          structured_output:
            expr: results.u
            type: javascript
      summary: Sheet Push
