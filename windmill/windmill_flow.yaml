    - id: u
      value:
        lock: |
          # py: 3.12
        type: rawscript
        content: >-
          import json



          def main(
              offer_id,
              correct,
              recheck_results,
              bl_profile_status,
              bl_profile_reason,
              buyer_activity_status,
              buyer_activity_reason,
              decision_verdict,
              decision_reason,
              incorrect_details,
              pns_data
          ):

              # --------------------------------------------------
              # Parse Parsing Script Output
              # --------------------------------------------------
              if isinstance(correct, str):
                  try:
                      correct = json.loads(correct)
                  except Exception:
                      correct = {}

              # If the entire parser output is passed
              if isinstance(correct, dict) and "correct" in correct:
                  correct = correct["correct"]

              if not isinstance(correct, dict):
                  correct = {}

              # --------------------------------------------------
              # Parse Recheck Output
              # --------------------------------------------------
              if isinstance(recheck_results, str):
                  try:
                      recheck_results = json.loads(recheck_results)
                  except Exception:
                      recheck_results = []

              # If wrapped inside {"results": [...]}
              if isinstance(recheck_results, dict):
                  recheck_results = recheck_results.get("results", [])

              if recheck_results is None:
                  recheck_results = []

              # --------------------------------------------------
              # Parse Incorrect Details (pre-recheck status/reason for
              # agents flagged incorrect in the first pass)
              # --------------------------------------------------
              if isinstance(incorrect_details, str):
                  try:
                      incorrect_details = json.loads(incorrect_details)
                  except Exception:
                      incorrect_details = {}

              if not isinstance(incorrect_details, dict):
                  incorrect_details = {}

              # --------------------------------------------------
              # Build Recheck Lookup
              # --------------------------------------------------
              recheck_lookup = {}

              for item in recheck_results:

                  if not isinstance(item, dict):
                      continue

                  agent = item.get("agent") or item.get("Agent")

                  if not agent:
                      continue

                  recheck_lookup[agent] = {
                      "status": item.get("status"),
                      "reason": item.get("reason")
                  }

              # --------------------------------------------------
              # Helper: flatten agent name -> key prefix
              # --------------------------------------------------
              def prefix(agent_name):
                  return agent_name.replace(" ", "_")

              # --------------------------------------------------
              # Initialize Output (Order Preserved)
              # --------------------------------------------------
              output = {}

              output["offer_id"] = offer_id
              output["Decision Verdict"] = decision_verdict
              output["Decision Reason"] = decision_reason

              # --------------------------------------------------
              # Retail Agent
              # --------------------------------------------------
              retail = correct.get("Retail Agent", {})
              p = prefix("Retail Agent")

              output[f"{p}_classification"] = retail.get("classification")
              output[f"{p}_reason"] = retail.get("reason")

              # --------------------------------------------------
              # Description Agent
              # --------------------------------------------------
              description = correct.get("Description Agent", {})
              p = prefix("Description Agent")

              output[f"{p}_status"] = description.get("status")
              output[f"{p}_reason"] = description.get("reason")

              # --------------------------------------------------
              # Product Validation Agents
              # (Recheck takes precedence; pre-recheck status/reason is
              # additionally surfaced for any agent that was actually
              # flagged incorrect in the first pass.)
              # --------------------------------------------------
              PRODUCT_AGENTS = [
                  "Title vs MCAT Agent",
                  "Title ISQ Agent",
                  "ISQ vs MCAT Agent",
                  "Inter ISQ Agent"
              ]

              for agent in PRODUCT_AGENTS:

                  p = prefix(agent)

                  if agent in recheck_lookup:
                      output[f"{p}_status"] = recheck_lookup[agent].get("status")
                      output[f"{p}_reason"] = recheck_lookup[agent].get("reason")
                      output[f"{p}_source"] = "recheck"
                  else:
                      obj = correct.get(agent) or incorrect_details.get(agent, {})
                      output[f"{p}_status"] = obj.get("status")
                      output[f"{p}_reason"] = obj.get("reason")
                      output[f"{p}_source"] = "parsing"

                  # Always present for all 4 product agents; None when not rechecked.
                  before = incorrect_details.get(agent, {})
                  output[f"{p}_before_recheck_status"] = before.get("status")
                  output[f"{p}_before_recheck_reason"] = before.get("reason")

              # --------------------------------------------------
              # Buyer Viewed Agent (Original Parsing Output)
              # --------------------------------------------------
              buyer_viewed = correct.get("Buyer Viewed Agent", {})
              p = prefix("Buyer Viewed Agent")

              output[f"{p}_status"] = buyer_viewed.get("status")
              output[f"{p}_reason"] = buyer_viewed.get("reason")

              # --------------------------------------------------
              # Buyer Viewed Agent vs CSL
              # --------------------------------------------------
              p = prefix("Buyer Viewed Agent vs CSL")

              output[f"{p}_status"] = buyer_activity_status
              output[f"{p}_reason"] = buyer_activity_reason

              # --------------------------------------------------
              # Profile Validity Agent
              # --------------------------------------------------
              profile = correct.get("Profile Validity Agent", {})
              p = prefix("Profile Validity Agent")

              output[f"{p}_valid"] = profile.get("valid")
              output[f"{p}_reasons"] = profile.get("reasons")

              # --------------------------------------------------
              # BL Profile Agent
              # --------------------------------------------------
              p = prefix("BL Profile Agent")

              output[f"{p}_status"] = bl_profile_status
              output[f"{p}_reason"] = bl_profile_reason
              output["additional_data_pns"] = pns_data

              return output
        language: python3
        input_transforms:
          correct:
            expr: results.w.correct
            type: javascript
          offer_id:
            expr: flow_input.offer_id
            type: javascript
          pns_data:
            expr: results.wl
            type: javascript
          decision_reason:
            expr: results.wg.Reason
            type: javascript
          recheck_results:
            expr: results.y.output.results
            type: javascript
          decision_verdict:
            expr: results.wg.Final_Verdict
            type: javascript
          bl_profile_reason:
            expr: results.wh.output.reasoning
            type: javascript
          bl_profile_status:
            expr: results.wh.output.status
            type: javascript
          incorrect_details:
            expr: results.w.incorrect_details
            type: javascript
          buyer_activity_reason:
            expr: results.wi.reason
            type: javascript
          buyer_activity_status:
            expr: results.wi.status
            type: javascript
      summary: Final_structured
    - id: wm
      value:
        lock: |-
          # py: 3.12
          anyio==4.14.2
          certifi==2026.7.22
          h11==0.16.0
          httpcore==1.0.9
