                    # py: 3.12
                  type: rawscript
                  content: >-
                    import re

                    from difflib import SequenceMatcher

                    from urllib.parse import unquote

                    from datetime import datetime



                    STOPWORDS = {
                        "a", "an", "the", "of", "for", "and", "or", "with", "to", "in", "on",
                        "by", "is", "are", "type", "types", "number", "no", "set", "sets",
                    }


                    ACTIVITY_LABELS = {
                        "ENQ": "an enquiry",
                        "BL": "a buylead",
                        "Browse": "a product browse",
                        "Search": "a search",
                    }


                    MATCH_THRESHOLD = 0.5  # tune this: higher = stricter
                    matching



                    def _normalize(text) -> str:
                        """Lowercase, url-decode, strip punctuation, collapse whitespace."""
                        if not text or text == "-":
                            return ""
                        text = unquote(str(text))
                        text = text.lower()
                        text = re.sub(r"[^a-z0-9\s]", " ", text)
                        text = re.sub(r"\s+", " ", text).strip()
                        return text


                    def _tokens(text: str) -> set:
                        normalized = _normalize(text)
                        return {w for w in normalized.split() if len(w) > 2 and w not in STOPWORDS}


                    def _format_datetime(raw) -> str:
                        try:
                            return datetime.strptime(str(raw), "%Y%m%d%H%M%S").strftime("%d %b %Y, %I:%M %p")
                        except (ValueError, TypeError):
                            return str(raw) if raw else "an unknown time"


                    def _build_signals(buyer_activity: dict):
                        """Flatten buyer_activity into comparable text signals, one per event.

                        Supports two shapes seen from the upstream APIs:
                          - {"DETAILS": [{"keyword": ..., "glcat_mcat_name": ..., "mcat_names": ..., "activity_type": ..., "datetime": ...}]}
                          - {"events":  [{"keyword": ..., "activity_type": ..., "datetime": ...}]}
                        """
                        entries = (buyer_activity or {}).get("DETAILS")
                        if entries is None:
                            entries = (buyer_activity or {}).get("events")

                        signals = []
                        for entry in entries or []:
                            texts = set()

                            keyword = _normalize(entry.get("keyword"))
                            if keyword:
                                texts.add(keyword)

                            glcat_mcat_name = _normalize(entry.get("glcat_mcat_name"))
                            if glcat_mcat_name:
                                texts.add(glcat_mcat_name)

                            mcat_names = entry.get("mcat_names")
                            if isinstance(mcat_names, list):
                                for name in mcat_names:
                                    norm_name = _normalize(name)
                                    if norm_name:
                                        texts.add(norm_name)
                            elif mcat_names:
                                norm_name = _normalize(mcat_names)
                                if norm_name:
                                    texts.add(norm_name)

                            if not texts:
                                continue

                            signals.append({
                                "texts": texts,
                                "activity_type": entry.get("activity_type", "activity"),
                                "datetime": entry.get("datetime"),
                            })
                        return signals


                    def _best_match(item_name: str, signals: list):
                        """Return the (score, signal, matched_text, overlap_tokens) that best matches item_name, or None."""
                        item_tokens = _tokens(item_name)
                        item_norm = _normalize(item_name)
                        if not item_tokens:
                            return None

                        best = None
                        for signal in signals:
                            for text in signal["texts"]:
                                sig_tokens = {w for w in text.split() if len(w) > 2 and w not in STOPWORDS}
                                if not sig_tokens:
                                    continue

                                overlap = item_tokens & sig_tokens
                                overlap_ratio = len(overlap) / len(item_tokens)
                                substring_hit = bool(item_norm) and (item_norm in text or text in item_norm)
                                similarity = SequenceMatcher(None, item_norm, text).ratio()

                                score = max(overlap_ratio, similarity)
                                if substring_hit:
                                    score = max(score, 0.9)

                                if best is None or score > best[0]:
                                    best = (score, signal, text, overlap)

                        return best


                    def _match_one(item_name: str, signals: list) -> dict:
                        """Match a single product name against the buyer's activity signals."""
                        best = _best_match(item_name, signals)

                        if best and best[0] >= MATCH_THRESHOLD:
                            score, signal, matched_text, overlap = best
                            activity_label = ACTIVITY_LABELS.get(signal["activity_type"], signal["activity_type"] or "an activity")
                            when = _format_datetime(signal["datetime"])
                            shared = ", ".join(sorted(overlap)) if overlap else matched_text
                            return {
                                "status": "matched",
                                "reason": (
                                    f"'{item_name}' matches buyer intent for '{matched_text}' via {activity_label} "
                                    f"on {when} (overlap: {shared})"
                                ),
                            }

                        return {
                            "status": "not matched",
                            "reason": f"'{item_name}' has no overlapping search, browse, enquiry, or buylead activity",
                        }


                    def main(product_enq: list, buyer_activity: dict) -> dict:
                        signals = _build_signals(buyer_activity)

                        per_product = [
                            _match_one(product.get("FK_PC_ITEM_NAME", ""), signals)
                            for product in (product_enq or [])
                        ]

                        overall_status = "matched" if any(p["status"] == "matched" for p in per_product) else "not matched"
                        reason = "; ".join(p["reason"] for p in per_product) if per_product else "No products were provided to check."

                        return {
                            "status": overall_status,
                            "reason": reason,
                        }
                  language: python3
                  input_transforms:
                    product_enq:
                      expr: results.i.RESPONSE.DATA.PRODUCTS_ENQUIRED
                      type: javascript
                    buyer_activity:
                      expr: results.wj
                      type: javascript
                summary: Buyer Viewed vs CSL
            summary: ""
            parallel: true
            skip_failure: true
          - expr: "false"
            modules:
              - id: wk
                value:
                  lock: |
                    # py: 3.12
                  type: rawscript
                  content: >
                    import base64

                    import urllib.parse

                    from datetime import date, datetime, timedelta


                    _RC4_KEY = "1996c39iil"



                    def _rc4(data: bytes, key: str) -> bytes:
                        s = list(range(256))
                        kb = key.encode()
                        j = 0
                        for i in range(256):
                            j = (j + s[i] + kb[i % len(kb)]) % 256
                            s[i], s[j] = s[j], s[i]
                        i = j = 0
                        out = bytearray()
                        for byte in data:
                            i = (i + 1) % 256
                            j = (j + s[i]) % 256
                            s[i], s[j] = s[j], s[i]
                            k = s[(s[i] + s[j]) % 256]
                            out.append(byte ^ k)
                        return bytes(out)


                    def _decrypt_glid(enc: str) -> str:
                        return _rc4(base64.b64decode(urllib.parse.unquote(enc)), _RC4_KEY).decode()


                    def main(mcat: str, glid: str, approval_date: str) -> str:
                        if len(approval_date) == 14:
                            d = datetime.strptime(approval_date, "%Y%m%d%H%M%S").date()
                        else:
                            d = date.fromisoformat(approval_date)
                        date_from = d - timedelta(days=2)
                        date_to = d
                        plain_glid = _decrypt_glid(glid)

                        return f"""
                    SELECT p.user_glid, p.user_role, f.src_mcat_id,
                    fel.llm_extracted_json_masked, fel.created_at

                    FROM pns_insight.participants p

                    INNER JOIN pns_insight.files f ON p.file_id = f.id

                    INNER JOIN pns_insight.file_extraction_logs fel ON f.id =
                    fel.file_id

                    WHERE p.is_active = TRUE
                      AND f.is_active = TRUE
                      AND fel.is_active = TRUE
                      AND p.user_role = 'BUYER'
                      AND date(fel.created_at) BETWEEN '{date_from}' AND '{date_to}'
                      AND f.src_mcat_id = {mcat}
                      AND p.user_glid = {plain_glid}
                    """.strip()
                  language: python3
                  input_transforms:
                    glid:
                      expr: results.i.RESPONSE.DATA.FK_GLUSR_USR_ID
                      type: javascript
                    mcat:
                      expr: results.i.RESPONSE.DATA.FK_GLCAT_MCAT_ID
                      type: javascript
                    approval_date:
                      expr: results.i.RESPONSE.DATA.OFR_DATE
                      type: javascript
                summary: Write query
              - id: wl
                value:
                  path: u/anuragupadhyay2/redash_call_data
                  type: flow
                  input_transforms:
                    query:
                      expr: results.wk
                      type: javascript
                    api_key:
                      type: static
                      value: oxc4cSjRB71UPckrkf4iBZRSclfDXfzfaxVCyyMC
                    db_name:
                      type: static
                      value: clickhouse-dataverse-prod
            summary: ""
            parallel: true
            skip_failure: true
        parallel: true
      summary: ""
    - id: w
      value:
        lock: |
          # py: 3.12
        type: rawscript
        content: |-
          import json

          # ---------------------------------------------------------------------------
          # Fixed sequence of agents as they appear in the input array (results.a),
          # in this order:
          #   [0] Buyer Viewed        [1] Description        [2] Inter ISQ
          #   [3] list of 3 sub-responses -> Title ISQ, Title vs MCAT, ISQ vs MCAT
          #   [4] Retail               [5] Profile Validity   [6] Buyer Activity
          # ---------------------------------------------------------------------------
          AGENT_NAMES = {
              "buyer_viewed": "Buyer Viewed Agent",
              "description": "Description Agent",
              "inter_isq": "Inter ISQ Agent",
              "title_isq": "Title ISQ Agent",
              "title_vs_mcat": "Title vs MCAT Agent",
              "isq_vs_mcat": "ISQ vs MCAT Agent",
              "retail": "Retail Agent",
              "profile_validity": "Profile Validity Agent",
              "buyer_activity": "Buyer Activity",
          }

          # Only these 4 product-validation agents are ever allowed to land in the
          # "incorrect" bucket. Every other agent (Buyer Viewed, Description, Retail,
          # Profile Validity, Buyer Activity) always goes into "correct", regardless of
          # its own verdict -- its real field values (status, reason, etc.) are kept
          # as-is in the payload, only the bucket placement is forced.
          CORE_AGENTS = {"title_isq", "title_vs_mcat", "isq_vs_mcat", "inter_isq"}


          def _safe_index(lst, idx):
              """Return lst[idx] if it exists, else None (never raises)."""
              if isinstance(lst, list) and 0 <= idx < len(lst):
                  return lst[idx]
              return None


          def normalize_verdict(value):
              """
              Map many possible verdict spellings to 'correct' / 'incorrect'.
              Returns None if the value can't be recognized at all.
              """
              if value is None:
                  return None
              v = str(value).strip().lower().replace("_", " ")
              if v in ("correct", "not outlier", "true", "valid", "yes"):
                  return "correct"
              if v in ("incorrect", "outlier", "false", "invalid", "no"):
                  return "incorrect"
              return None


          def _bucket_entry(entry, bucket_map, agent_key, name, bucket, payload):
              """Push `payload` into bucket_map[bucket][name], recording provenance."""
              payload["agent"] = name
              bucket_map[bucket][name] = payload


          # ---------------------------------------------------------------------------
          # Individual agent parsers
          # Each returns: (bucket:'correct'|'incorrect', payload:dict)
          # ---------------------------------------------------------------------------

          def parse_buyer_viewed(data):
              """Element [0]: reason / status / product_matched"""
              if not isinstance(data, dict):
                  return "incorrect", {
                      "error": True,
                      "error_note": "Expected a dict for Buyer Viewed Agent, got something else / missing.",
                      "raw": data,
                  }

              status = data.get("status")
              verdict = normalize_verdict(status)

              payload = {
                  "status": status,
                  "reason": data.get("reason"),
                  "product_matched": data.get("product_matched"),
                  "error": verdict is None,
              }
              if verdict is None:
                  payload["error_note"] = f"Unrecognized/missing 'status' value: {status!r}"

              bucket = verdict if verdict is not None else "incorrect"
              return bucket, payload


          def parse_description(data):
              """Element [1]: term_match / description_audit{reason,status} / keyword_selection{error,reason,keywords}"""
              if not isinstance(data, dict):
                  return "incorrect", {
                      "error": True,
                      "error_note": "Expected a dict for Description Agent, got something else / missing.",
                      "raw": data,
                  }

              audit = data.get("description_audit")
              if not isinstance(audit, dict):
                  return "incorrect", {
                      "error": True,
                      "error_note": "Missing/malformed 'description_audit' block.",
                      "term_match": data.get("term_match"),
                      "keyword_selection": data.get("keyword_selection"),
                  }

              status = audit.get("status")
              verdict = normalize_verdict(status)

              keyword_selection = data.get("keyword_selection")
              if not isinstance(keyword_selection, dict):
                  keyword_selection = {}

              payload = {
                  "status": status,
                  "reason": audit.get("reason"),
                  "term_match": data.get("term_match"),
                  "keyword_selection": {
                      "error": keyword_selection.get("error"),
                      "reason": keyword_selection.get("reason"),
                      "keywords": keyword_selection.get("keywords"),
                  },
                  "error": verdict is None,
              }
              if verdict is None:
                  payload["error_note"] = f"Unrecognized/missing description_audit.status: {status!r}"

              bucket = verdict if verdict is not None else "incorrect"
              return bucket, payload


          def parse_inter_isq(data):
              """Element [2]: reason / status (score/confidence kept if present, for backward compat)"""
              if not isinstance(data, dict):
                  return "incorrect", {
                      "error": True,
                      "error_note": "Expected a dict for Inter ISQ Agent, got something else / missing.",
                      "raw": data,
                  }

              status = data.get("status")
              verdict = normalize_verdict(status)

              payload = {
                  "status": status,
                  "reason": data.get("reason", data.get("reasoning")),
                  "score": data.get("score"),
                  "confidence": data.get("confidence"),
                  "error": verdict is None,
              }
              if verdict is None:
                  payload["error_note"] = f"Unrecognized/missing status: {status!r}"

              bucket = verdict if verdict is not None else "incorrect"
              return bucket, payload


          def parse_sub_llm_agent(item):
              """
              Shared parser for the 3 sub-responses living inside element [3]
              (title ISQ / title vs mcat / ISQ vs mcat agents).
              Each item is normally: {cost, model, response:{reason, status, item_id?}, token_usage, response_time}
              but can instead be: {error:{name, message, ...}}  (windmill/LLM failure)
              """
              if item is None:
                  return "incorrect", {
                      "error": True,
                      "error_note": "Missing sub-agent entry (expected element not present in list).",
                  }

              if not isinstance(item, dict):
                  return "incorrect", {
                      "error": True,
                      "error_note": "Sub-agent entry was not a dict.",
                      "raw": item,
                  }

              # Case 1: explicit error block (e.g. JSONDecodeError from the LLM gateway)
              if "error" in item and "response" not in item:
                  err = item.get("error") or {}
                  return "incorrect", {
                      "error": True,
                      "error_note": "LLM/agent call failed before producing a verdict.",
                      "error_detail": {
                          "name": err.get("name"),
                          "message": err.get("message"),
                          "step_id": err.get("step_id"),
                      },
                  }

              response = item.get("response")
              if not isinstance(response, dict):
                  return "incorrect", {
                      "error": True,
                      "error_note": "Missing/malformed 'response' block.",
                      "raw": item,
                  }

              verdict = normalize_verdict(response.get("status"))
              payload = {
                  "status": response.get("status"),
                  "reason": response.get("reason"),
                  "item_id": response.get("item_id"),
                  "model": item.get("model"),
                  "cost": item.get("cost"),
                  "response_time": item.get("response_time"),
                  "token_usage": item.get("token_usage"),
                  "error": verdict is None,
              }
              if verdict is None:
                  payload["error_note"] = f"Unrecognized/missing response.status: {response.get('status')!r}"

              bucket = verdict if verdict is not None else "incorrect"
              return bucket, payload


          def parse_retail(data):
              """
              Element [4]: reason / status
              status is a classification ("Retail" / "Non-Retail"), not a correct/incorrect
              verdict, so this agent is always filed under 'correct' by add() regardless
              of what's returned here.
              """
              if not isinstance(data, dict):
                  return "incorrect", {
                      "error": True,
                      "error_note": "Expected a dict for Retail Agent, got something else / missing.",
                      "raw": data,
                  }

              classification = data.get("status")
              payload = {
                  "classification": classification,
                  "reason": data.get("reason"),
                  "error": classification is None,
              }
              if classification is None:
                  payload["error_note"] = f"Unrecognized/missing 'status' value: {classification!r}"

              bucket = "correct" if classification is not None else "incorrect"
              return bucket, payload


          def parse_profile_validity(data):
              """Element [5]: valid / profile / reasons"""
              if not isinstance(data, dict):
                  return "incorrect", {
                      "error": True,
                      "error_note": "Expected a dict for Profile Validity Agent, got something else / missing.",
                      "raw": data,
                  }

              valid = data.get("valid")
              payload = {
                  "valid": valid,
                  "profile": data.get("profile"),
                  "reasons": data.get("reasons"),
              }
              if valid is True:
                  payload["error"] = False
                  return "correct", payload
              if valid is False:
                  payload["error"] = False
                  return "incorrect", payload

              payload["error"] = True
              payload["error_note"] = f"Unrecognized/missing 'valid' field: {valid!r}"
              return "incorrect", payload


          def parse_buyer_activity(data):
              """
              Element [6]: buyer_activity_fetch output -- ok / code / error / events / message / summary
              Informational only (never a pass/fail verdict) -- always filed under
              'correct' by add(); parsed defensively regardless.
              """
              if not isinstance(data, dict):
                  return "correct", {
                      "error": True,
                      "error_note": "Expected a dict for Buyer Activity, got something else / missing.",
                      "raw": data,
                  }

              summary = data.get("summary")
              if not isinstance(summary, dict):
                  summary = {}
              events = data.get("events")

              payload = {
                  "ok": data.get("ok"),
                  "code": data.get("code"),
                  "message": data.get("message"),
                  "glid": summary.get("glid"),
                  "total_records": summary.get("total"),
                  "bl_count": summary.get("bl_count"),
                  "enq_count": summary.get("enq_count"),
                  "range_from": summary.get("range_from"),
                  "range_to": summary.get("range_to"),
                  "top_city": summary.get("top_city"),
                  "type_counts": summary.get("type_counts"),
                  "events": events if isinstance(events, list) else [],
                  "error": bool(data.get("error")) and data.get("ok") is not True,
              }
              return "correct", payload


          def main(x):
              """
              Windmill entrypoint.
              Accepts either a JSON string or an already-parsed list (defensive, since
              upstream steps sometimes hand this off as a string and sometimes as a
              native object).

              Returns:
                  {
                      "correct":   { "<Agent Name>": {...}, ... },
                      "incorrect": { "<Agent Name>": "<Agent Name>", ... },
                      "incorrect_details": { "<Agent Name>": {...}, ... },
                  }
              """
              if isinstance(x, str):
                  try:
                      data = json.loads(x)
                  except Exception as e:
                      return {
                          "correct": {},
                          "incorrect": {
                              "Input Parsing": {
                                  "error": True,
                                  "error_note": f"Failed to parse input JSON string: {e}",
                                  "raw": x,
                              }
                          },
                          "incorrect_details": {},
                      }
              else:
                  data = x

              if not isinstance(data, list):
                  return {
                      "correct": {},
                      "incorrect": {
                          "Input Parsing": {
                              "error": True,
                              "error_note": "Expected the input to be a JSON array of agent responses.",
                              "raw": data,
                          }
                      },
                      "incorrect_details": {},
                  }

              result = {"correct": {}, "incorrect": {}, "incorrect_details": {}}

              def add(agent_key, bucket, payload):
                  if agent_key not in CORE_AGENTS:
                      bucket = "correct"
                  name = AGENT_NAMES[agent_key]
                  # For the "incorrect" bucket we only want the agent's name, not the
                  # full payload -- the detailed dict (status/reason/etc.) is preserved
                  # separately in "incorrect_details" so downstream steps can still
                  # report the pre-recheck status/reason for flagged agents.
                  if bucket == "incorrect":
                      result[bucket][name] = name
                      result["incorrect_details"][name] = payload
                  else:
                      result[bucket][name] = payload

              # 1. Buyer Viewed Agent
              bucket, payload = parse_buyer_viewed(_safe_index(data, 0))
              add("buyer_viewed", bucket, payload)

              # 2. Description Agent
              bucket, payload = parse_description(_safe_index(data, 1))
              add("description", bucket, payload)

              # 3. Inter ISQ Agent
              bucket, payload = parse_inter_isq(_safe_index(data, 2))
              add("inter_isq", bucket, payload)

              # 4-6. Title ISQ / Title vs MCAT / ISQ vs MCAT Agents (list of 3 sub-responses)
              sub_list = _safe_index(data, 3)
              sub_keys = ["title_isq", "title_vs_mcat", "isq_vs_mcat"]
              for i, agent_key in enumerate(sub_keys):
                  item = _safe_index(sub_list, i) if isinstance(sub_list, list) else None
                  bucket, payload = parse_sub_llm_agent(item)
                  add(agent_key, bucket, payload)

              # 7. Retail Agent
              bucket, payload = parse_retail(_safe_index(data, 4))
              add("retail", bucket, payload)

              # 8. Profile Validity Agent
              bucket, payload = parse_profile_validity(_safe_index(data, 5))
              add("profile_validity", bucket, payload)


              return result
        language: python3
