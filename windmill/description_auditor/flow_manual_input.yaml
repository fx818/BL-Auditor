summary: Description Auditor (Manual Input)
description: |-
  Audits a BuyLead description without calling the BuyLead API.
  Provide the fields directly. Output: { Display_id, Status, Score, Confidence, Reason, Issues }.
value:
  modules:
    - id: audit_description
      summary: Audit Description
      value:
        type: rawscript
        language: python3
        input_transforms:
          display_id:
            type: javascript
            expr: flow_input.display_id
          mcat_name:
            type: javascript
            expr: flow_input.mcat_name
          item_name:
            type: javascript
            expr: flow_input.item_name
          description:
            type: javascript
            expr: flow_input.description
        content: |
          # requirements:
          # openai

          import json
          import os
          import re
          import time

          from openai import OpenAI

          SYSTEM_PROMPT = """# Description-vs-Title / MCAT Coherence Auditor
          ### IndiaMart BuyLeads

          You are a Description-vs-Title/MCAT coherence auditor for IndiaMart BuyLeads.

          Your job: given a BuyLead's MCAT name, item title, and the buyer-supplied free-text
          description, classify whether the description is related to, coherent with, or consistent
          with the title and MCAT. You judge ONLY whether the description text is reasonably related
          to the same product family, product category, or use-case as the title and MCAT.

          ## Output — Status Values

          - Correct: The default. Description is related to / coherent with / consistent with title/MCAT.
            Minor stylistic differences, marketing fluff, or extra noise do NOT disqualify a lead.
          - Incorrect: Description is about a clearly and grossly different product category with no
            plausible connection, OR is structural garbage (random chars, filler, boilerplate contact-only).
          - Not Available: Description is empty or whitespace-only.

          ## Default Stance — Lean Strongly Towards Correct

          Most BuyLeads will be Correct. Bar for Incorrect is gross mismatch — no plausible connection.
          When in doubt, always choose Correct and lower Confidence.

          ## Broad Coherence — What Counts as Related

          1. Same product family (Steel Pipe / MS Pipe / ERW Pipe → all same family)
          2. Same product, different variant/grade/size (AAA Battery / AA Battery → coherent)
          3. Related product in same broad category (Mobile Accessories / Mobile Phones → Correct)
          4. Use-case or application mention ("Electrical use" for Canvas Bags → Correct)
          5. "Buyer searched for X" phrasing — evaluate X's relation to title/MCAT, not the phrasing
          6. Quantity-only descriptions ("Need 500 kg per month" → always Correct)
          7. Title product mentioned alongside unrelated products → ambiguous but still Correct

          ## Scoring Guide (0.0–1.0)

          0.85–1.00 Correct   — description clearly and directly fits title and MCAT
          0.65–0.84 Correct   — on-topic but thin, or related variant with clear connection
          0.45–0.64 Correct   — same broad category/use-case, link requires inference; use "partial" issue
          0.05–0.44 Incorrect — grossly different product family, or structural garbage/denial
          0.00–0.04 Not Available — description empty

          ## Confidence

          High: unambiguous. Medium: required some judgment. Low: very short or tenuous but plausible.

          ## Output Contract — Strict JSON, no fences, no prose

          {
            "status": "Correct" | "Incorrect" | "Not Available",
            "score": <float 0.0-1.0, two decimals>,
            "confidence": "High" | "Medium" | "Low",
            "reasoning": "<1-3 sentences citing at least one phrase from the Description>",
            "issues": [{"type": "mismatch"|"partial"|"garbage", "fields": [...], "detail": "..."}]
          }

          Rules: issues=[] for clean Correct; Correct with partial ambiguity adds partial issue entry;
          Incorrect MUST have at least one issue; Not Available has issues=[].
          NEVER output anything but the JSON object.
          """


          def _clean_output(raw: str) -> dict:
              text = (raw or "").replace("```json", "").replace("```", "").strip()
              if not text:
                  raise ValueError("LLM returned empty response")
              try:
                  return json.loads(text)
              except json.JSONDecodeError:
                  match = re.search(r"\{[\s\S]*\}", text)
                  if not match:
                      raise ValueError(f"No JSON in LLM output: {text[:300]}")
                  return json.loads(match.group(0))


          def _safe_score(value):
              if value is None or value == "":
                  return None
              try:
                  num = float(value)
              except (TypeError, ValueError):
                  return None
              if num > 1.0:
                  num /= 100.0
              return round(max(0.0, min(1.0, num)), 2)


          def _safe_issues(value) -> list:
              if not isinstance(value, list):
                  return []
              out = []
              for item in value:
                  if isinstance(item, dict):
                      out.append({
                          "type": str(item.get("type", "")),
                          "fields": item.get("fields") if isinstance(item.get("fields"), list) else [],
                          "detail": str(item.get("detail", "")),
                      })
              return out


          def main(display_id: str, mcat_name: str, item_name: str, description: str) -> dict:
              if not description.strip():
                  return {
                      "Display_id": display_id,
                      "Status": "Not Available",
                      "Score": 0.0,
                      "Confidence": "High",
                      "Reason": "No description was provided.",
                      "Issues": [{"type": "missing", "fields": ["description"], "detail": "Description is empty."}],
                  }

              user_message = (
                  "Audit the following BuyLead's description against its title and MCAT.\n\n"
                  f"MCAT: {mcat_name}\n"
                  f"Item: {item_name}\n"
                  f"Description:\n{description}\n\n"
                  "Return ONLY the JSON object described in the system prompt. No prose, no markdown fences."
              )

              base_url = os.environ.get("LLM_BASE_URL")
              api_key = os.environ["LLM_API_KEY"]
              model = os.environ["LLM_MODEL"]
              timeout = float(os.environ.get("LLM_TIMEOUT", "60"))
              max_retries = int(os.environ.get("LLM_MAX_RETRIES", "2"))

              client = OpenAI(api_key=api_key, base_url=base_url or None)

              last_exc = None
              for attempt in range(max_retries + 1):
                  try:
                      response = client.chat.completions.create(
                          model=model,
                          messages=[
                              {"role": "system", "content": SYSTEM_PROMPT},
                              {"role": "user", "content": user_message},
                          ],
                          response_format={"type": "json_object"},
                          timeout=timeout,
                      )
                      raw = response.choices[0].message.content
                      parsed = _clean_output(raw)
                      return {
                          "Display_id": display_id,
                          "Status": str(parsed.get("status", "Error")),
                          "Score": _safe_score(parsed.get("score")),
                          "Confidence": str(parsed.get("confidence", "Low")),
                          "Reason": str(parsed.get("reasoning", parsed.get("reason", "Error parsing reasoning"))),
                          "Issues": _safe_issues(parsed.get("issues")),
                      }
                  except Exception as exc:
                      last_exc = exc
                      if attempt < max_retries:
                          time.sleep(2 ** attempt)

              raise RuntimeError(
                  f"audit_description exhausted {max_retries + 1} attempts: {last_exc}"
              ) from last_exc

schema:
  $schema: "https://json-schema.org/draft/2020-12/schema"
  type: object
  required:
    - display_id
    - mcat_name
    - item_name
    - description
  properties:
    display_id:
      type: string
      description: BuyLead offer display ID (for reference only)
      title: Display ID
    mcat_name:
      type: string
      description: IndiaMart product category (e.g. "Steel Pipes")
      title: MCAT Name
    item_name:
      type: string
      description: Buyer's item title
      title: Item Name
    description:
      type: string
      description: Buyer's free-text description to audit
      title: Description
