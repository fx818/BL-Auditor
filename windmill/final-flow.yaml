    - id: w
      value:
        lock: |
          # py: 3.12
        type: rawscript
        content: |-
          import json

          # ---------------------------------------------------------------------------
          # Fixed sequence of agents as they appear in the input array (results.a),
          # in this order:
          #   [0] Buyer Viewed        [1] Description        [2] Inter ISQ
          #   [3] list of 3 sub-responses -> Title ISQ, Title vs MCAT, ISQ vs MCAT
          #   [4] Retail               [5] Profile Validity   [6] Buyer Activity
          # ---------------------------------------------------------------------------
          AGENT_NAMES = {
              "buyer_viewed": "Buyer Viewed Agent",
              "description": "Description Agent",
              "inter_isq": "Inter ISQ Agent",
              "title_isq": "Title ISQ Agent",
              "title_vs_mcat": "Title vs MCAT Agent",
              "isq_vs_mcat": "ISQ vs MCAT Agent",
              "retail": "Retail Agent",
              "profile_validity": "Profile Validity Agent",
              "buyer_activity": "Buyer Activity",
          }

          # Only these 4 product-validation agents are ever allowed to land in the
          # "incorrect" bucket. Every other agent (Buyer Viewed, Description, Retail,
          # Profile Validity, Buyer Activity) always goes into "correct", regardless of
          # its own verdict -- its real field values (status, reason, etc.) are kept
          # as-is in the payload, only the bucket placement is forced.
          CORE_AGENTS = {"title_isq", "title_vs_mcat", "isq_vs_mcat", "inter_isq"}


          def _safe_index(lst, idx):
              """Return lst[idx] if it exists, else None (never raises)."""
              if isinstance(lst, list) and 0 <= idx < len(lst):
                  return lst[idx]
              return None


          def normalize_verdict(value):
              """
              Map many possible verdict spellings to 'correct' / 'incorrect'.
              Returns None if the value can't be recognized at all.
              """
              if value is None:
                  return None
              v = str(value).strip().lower().replace("_", " ")
              if v in ("correct", "not outlier", "true", "valid", "yes"):
                  return "correct"
              if v in ("incorrect", "outlier", "false", "invalid", "no"):
                  return "incorrect"
              return None


          def _bucket_entry(entry, bucket_map, agent_key, name, bucket, payload):
              """Push `payload` into bucket_map[bucket][name], recording provenance."""
              payload["agent"] = name
              bucket_map[bucket][name] = payload


          # ---------------------------------------------------------------------------
          # Individual agent parsers
          # Each returns: (bucket:'correct'|'incorrect', payload:dict)
          # ---------------------------------------------------------------------------

          def parse_buyer_viewed(data):
              """Element [0]: reason / status / product_matched"""
              if not isinstance(data, dict):
                  return "incorrect", {
                      "error": True,
                      "error_note": "Expected a dict for Buyer Viewed Agent, got something else / missing.",
                      "raw": data,
                  }

              status = data.get("status")
              verdict = normalize_verdict(status)

              payload = {
                  "status": status,
                  "reason": data.get("reason"),
                  "product_matched": data.get("product_matched"),
                  "error": verdict is None,
              }
              if verdict is None:
                  payload["error_note"] = f"Unrecognized/missing 'status' value: {status!r}"

              bucket = verdict if verdict is not None else "incorrect"
              return bucket, payload


          def parse_description(data):
              """Element [1]: term_match / description_audit{reason,status} / keyword_selection{error,reason,keywords}"""
              if not isinstance(data, dict):
                  return "incorrect", {
                      "error": True,
                      "error_note": "Expected a dict for Description Agent, got something else / missing.",
                      "raw": data,
                  }

              audit = data.get("description_audit")
              if not isinstance(audit, dict):
                  return "incorrect", {
                      "error": True,
                      "error_note": "Missing/malformed 'description_audit' block.",
                      "term_match": data.get("term_match"),
                      "keyword_selection": data.get("keyword_selection"),
                  }

              status = audit.get("status")
              verdict = normalize_verdict(status)

              keyword_selection = data.get("keyword_selection")
              if not isinstance(keyword_selection, dict):
                  keyword_selection = {}

              payload = {
                  "status": status,
                  "reason": audit.get("reason"),
                  "term_match": data.get("term_match"),
                  "keyword_selection": {
                      "error": keyword_selection.get("error"),
                      "reason": keyword_selection.get("reason"),
                      "keywords": keyword_selection.get("keywords"),
                  },
                  "error": verdict is None,
              }
              if verdict is None:
                  payload["error_note"] = f"Unrecognized/missing description_audit.status: {status!r}"

              bucket = verdict if verdict is not None else "incorrect"
              return bucket, payload


          def parse_inter_isq(data):
              """Element [2]: reason / status (score/confidence kept if present, for backward compat)"""
              if not isinstance(data, dict):
                  return "incorrect", {
                      "error": True,
                      "error_note": "Expected a dict for Inter ISQ Agent, got something else / missing.",
                      "raw": data,
                  }

              status = data.get("status")
              verdict = normalize_verdict(status)

              payload = {
                  "status": status,
                  "reason": data.get("reason", data.get("reasoning")),
                  "score": data.get("score"),
                  "confidence": data.get("confidence"),
                  "error": verdict is None,
              }
              if verdict is None:
                  payload["error_note"] = f"Unrecognized/missing status: {status!r}"

              bucket = verdict if verdict is not None else "incorrect"
              return bucket, payload


          def parse_sub_llm_agent(item):
              """
              Shared parser for the 3 sub-responses living inside element [3]
              (title ISQ / title vs mcat / ISQ vs mcat agents).
              Each item is normally: {cost, model, response:{reason, status, item_id?}, token_usage, response_time}
              but can instead be: {error:{name, message, ...}}  (windmill/LLM failure)
              """
              if item is None:
                  return "incorrect", {
                      "error": True,
                      "error_note": "Missing sub-agent entry (expected element not present in list).",
                  }

              if not isinstance(item, dict):
                  return "incorrect", {
                      "error": True,
                      "error_note": "Sub-agent entry was not a dict.",
                      "raw": item,
                  }

              # Case 1: explicit error block (e.g. JSONDecodeError from the LLM gateway)
              if "error" in item and "response" not in item:
                  err = item.get("error") or {}
                  return "incorrect", {
                      "error": True,
                      "error_note": "LLM/agent call failed before producing a verdict.",
                      "error_detail": {
                          "name": err.get("name"),
                          "message": err.get("message"),
                          "step_id": err.get("step_id"),
                      },
                  }

              response = item.get("response")
              if not isinstance(response, dict):
                  return "incorrect", {
                      "error": True,
                      "error_note": "Missing/malformed 'response' block.",
                      "raw": item,
                  }

              verdict = normalize_verdict(response.get("status"))
              payload = {
                  "status": response.get("status"),
                  "reason": response.get("reason"),
                  "item_id": response.get("item_id"),
                  "model": item.get("model"),
                  "cost": item.get("cost"),
                  "response_time": item.get("response_time"),
                  "token_usage": item.get("token_usage"),
                  "error": verdict is None,
              }
              if verdict is None:
                  payload["error_note"] = f"Unrecognized/missing response.status: {response.get('status')!r}"

              bucket = verdict if verdict is not None else "incorrect"
              return bucket, payload


          def parse_retail(data):
              """
              Element [4]: reason / status
              status is a classification ("Retail" / "Non-Retail"), not a correct/incorrect
              verdict, so this agent is always filed under 'correct' by add() regardless
              of what's returned here.
              """
              if not isinstance(data, dict):
                  return "incorrect", {
                      "error": True,
                      "error_note": "Expected a dict for Retail Agent, got something else / missing.",
                      "raw": data,
                  }

              classification = data.get("status")
              payload = {
                  "classification": classification,
                  "reason": data.get("reason"),
                  "error": classification is None,
              }
              if classification is None:
                  payload["error_note"] = f"Unrecognized/missing 'status' value: {classification!r}"

              bucket = "correct" if classification is not None else "incorrect"
              return bucket, payload


          def parse_profile_validity(data):
              """Element [5]: valid / profile / reasons"""
              if not isinstance(data, dict):
                  return "incorrect", {
                      "error": True,
                      "error_note": "Expected a dict for Profile Validity Agent, got something else / missing.",
                      "raw": data,
                  }

              valid = data.get("valid")
              payload = {
                  "valid": valid,
                  "profile": data.get("profile"),
                  "reasons": data.get("reasons"),
              }
              if valid is True:
                  payload["error"] = False
                  return "correct", payload
              if valid is False:
                  payload["error"] = False
                  return "incorrect", payload

              payload["error"] = True
              payload["error_note"] = f"Unrecognized/missing 'valid' field: {valid!r}"
              return "incorrect", payload


          def parse_buyer_activity(data):
              """
              Element [6]: buyer_activity_fetch output -- ok / code / error / events / message / summary
              Informational only (never a pass/fail verdict) -- always filed under
              'correct' by add(); parsed defensively regardless.
              """
              if not isinstance(data, dict):
                  return "correct", {
                      "error": True,
                      "error_note": "Expected a dict for Buyer Activity, got something else / missing.",
                      "raw": data,
                  }

              summary = data.get("summary")
              if not isinstance(summary, dict):
                  summary = {}
              events = data.get("events")

              payload = {
                  "ok": data.get("ok"),
                  "code": data.get("code"),
                  "message": data.get("message"),
                  "glid": summary.get("glid"),
                  "total_records": summary.get("total"),
                  "bl_count": summary.get("bl_count"),
                  "enq_count": summary.get("enq_count"),
                  "range_from": summary.get("range_from"),
                  "range_to": summary.get("range_to"),
                  "top_city": summary.get("top_city"),
                  "type_counts": summary.get("type_counts"),
                  "events": events if isinstance(events, list) else [],
                  "error": bool(data.get("error")) and data.get("ok") is not True,
              }
              return "correct", payload


          def main(x):
              """
              Windmill entrypoint.
              Accepts either a JSON string or an already-parsed list (defensive, since
              upstream steps sometimes hand this off as a string and sometimes as a
              native object).

              Returns:
                  {
                      "correct":   { "<Agent Name>": {...}, ... },
                      "incorrect": { "<Agent Name>": "<Agent Name>", ... },
                  }
              """
              if isinstance(x, str):
                  try:
                      data = json.loads(x)
                  except Exception as e:
                      return {
                          "correct": {},
                          "incorrect": {
                              "Input Parsing": {
                                  "error": True,
                                  "error_note": f"Failed to parse input JSON string: {e}",
                                  "raw": x,
                              }
                          },
                      }
              else:
                  data = x

              if not isinstance(data, list):
                  return {
                      "correct": {},
                      "incorrect": {
                          "Input Parsing": {
                              "error": True,
                              "error_note": "Expected the input to be a JSON array of agent responses.",
                              "raw": data,
                          }
                      },
                  }

              result = {"correct": {}, "incorrect": {}}

              def add(agent_key, bucket, payload):
                  if agent_key not in CORE_AGENTS:
                      bucket = "correct"
                  name = AGENT_NAMES[agent_key]
                  # For the "incorrect" bucket we only want the agent's name, not the
                  # full payload -- the detailed dict is still available in "correct"
                  # for agents that pass, but a failing core agent just gets flagged
                  # by name here.
                  if bucket == "incorrect":
                      result[bucket][name] = name
                  else:
                      result[bucket][name] = payload

              # 1. Buyer Viewed Agent
              bucket, payload = parse_buyer_viewed(_safe_index(data, 0))
              add("buyer_viewed", bucket, payload)

              # 2. Description Agent
              bucket, payload = parse_description(_safe_index(data, 1))
              add("description", bucket, payload)

              # 3. Inter ISQ Agent
              bucket, payload = parse_inter_isq(_safe_index(data, 2))
              add("inter_isq", bucket, payload)

              # 4-6. Title ISQ / Title vs MCAT / ISQ vs MCAT Agents (list of 3 sub-responses)
              sub_list = _safe_index(data, 3)
              sub_keys = ["title_isq", "title_vs_mcat", "isq_vs_mcat"]
              for i, agent_key in enumerate(sub_keys):
                  item = _safe_index(sub_list, i) if isinstance(sub_list, list) else None
                  bucket, payload = parse_sub_llm_agent(item)
                  add(agent_key, bucket, payload)

              # 7. Retail Agent
              bucket, payload = parse_retail(_safe_index(data, 4))
              add("retail", bucket, payload)

              # 8. Profile Validity Agent
              bucket, payload = parse_profile_validity(_safe_index(data, 5))
              add("profile_validity", bucket, payload)

              # 9. Buyer Activity (new -- element [6])
              bucket, payload = parse_buyer_activity(_safe_index(data, 6))
              add("buyer_activity", bucket, payload)

              return result
        language: python3
        input_transforms:
          x:
            expr: results.a
            type: javascript
      summary: Parsing
    - id: y
      value:
        type: branchone
        default:
          - id: y2
            value:
              lock: |
                # py: 3.12
              type: rawscript
              content: >-
                def main():
                    # Recheck skipped: 0, or 3+, of the 4 product-validation agents
                    # were flagged incorrect, so this branch returns an empty result
                    # so downstream steps see no overrides.
                    return {"output": "[]"}
              language: python3
              input_transforms: {}
            summary: Recheck skipped (relevant incorrect count not 1 or 2)
        branches:
          - expr: ([ "Title vs MCAT Agent" in (results.w && results.w.incorrect || {}),
              "Inter ISQ Agent" in (results.w && results.w.incorrect || {}),
              "Title ISQ Agent" in (results.w && results.w.incorrect || {}),
              "ISQ vs MCAT Agent" in (results.w && results.w.incorrect || {})
              ].filter(Boolean).length >= 1) && ([ "Title vs MCAT Agent" in
              (results.w && results.w.incorrect || {}), "Inter ISQ Agent" in
              (results.w && results.w.incorrect || {}), "Title ISQ Agent" in
              (results.w && results.w.incorrect || {}), "ISQ vs MCAT Agent" in
              (results.w && results.w.incorrect || {}) ].filter(Boolean).length
              <= 2)
            modules:
              - id: y1
                value:
                  type: aiagent
                  tools: []
                  input_transforms:
                    provider:
                      type: static
                      value:
                        kind: customai
                        model: deepseek/deepseek-v4-flash
                        resource: $res:u/anuragupadhyay2/inspirational_customai
                    output_type:
                      type: static
                      value: text
                    user_message:
                      expr: "`Agent: ${JSON.stringify(results.w.incorrect)}, Title:
                        ${results.i.RESPONSE.DATA.ETO_OFR_TITLE}, MCAT:
                        ${results.i.RESPONSE.DATA.PRIME_MCAT_NAME},
                        Desc:${results.i.RESPONSE.DATA.ETO_OFR_DESC}, ISQs:
                        ${results.i.RESPONSE.DATA.ENRICHMENTINFO},
                        Buyer_Viewed:${results.i.RESPONSE.DATA.PRODUCTS_ENQUIRE\
                        D}`"
                      type: javascript
                    system_prompt:
                      type: static
                      value: "# Check Agent — IndiaMART BuyLead Auditor\r

                        \r

                        ## Context\r

                        \r

                        IndiaMART is India's largest B2B online marketplace,
                        connecting buyers and suppliers across product
                        categories. This agent performs an **audit** of BuyLead
                        parameters to determine whether specific fields are
                        coherent and related to one another. It does **not**
                        validate or reference any prior agent's reasoning — it
                        independently determines, from the BuyLead data alone,
                        whether the requested parameters are coherent or
                        contradictory.\r

                        \r

                        ## Role\r

                        \r

                        You are the **Check Agent** in the IndiaMART BuyLead
                        Auditing System. You check **only** the agents listed in
                        `Agent`. For each one, independently audit only the
                        parameters mapped to that agent, using only the provided
                        BuyLead information.\r

                        \r

                        **Ignore:**\r

                        - Any parameter not assigned to the current agent\r

                        - Assumptions about buyer intent or missing
                        information\r

                        \r

                        Treat every check as a fresh, independent audit. You are
                        not evaluating \"the agent\" itself — you are performing
                        the audit that the named agent is responsible for, on
                        the actual BuyLead data.\r

                        \r

                        ## Objective\r

                        \r

                        For each agent listed in `Agent`:\r

                        1. Independently audit the parameters mapped to that
                        agent.\r

                        2. Use only the provided BuyLead information.\r

                        3. Decide a verdict: `not_outlier` (coherent, related,
                        or insufficient evidence to prove a contradiction) or
                        `outlier` (clear, evidence-based contradiction only).\r

                        4. Provide a short, factual reason based only on the
                        available evidence.\r

                        \r

                        ## Input Format\r

                        \r

                        ```json\r

                        {\r

                        \  \"Title\": \"string — BuyLead title\",\r

                        \  \"MCAT\": \"string — assigned product category\",\r

                        \  \"ISQs\": { \"key\": \"value, ...\" },\r

                        \  \"Agent\": [\"Title vs MCAT Agent\", \"Title ISQ
                        Agent\", \"ISQ vs MCAT Agent\", \"Inter ISQ Agent\"]\r

                        }\r

                        ```\r

                        \r

                        - **Title** — the BuyLead title.\r

                        - **MCAT** — the assigned product category.\r

                        - **ISQs** — dictionary of Industry Specific Questions
                        and their values (may include Buyer Filled Details,
                        Additional Requirements, Probable Order Value, Probable
                        Requirement Type).\r

                        - **Agent** — array of agent names to check. Only these
                        are evaluated.\r

                        \r

                        Example:\r

                        \r

                        ```json\r

                        {\r

                        \  \"Title\": \"Stainless Steel Water Tank\",\r

                        \  \"MCAT\": \"Plastic Water Storage Tank\",\r

                        \  \"ISQs\": {\r

                        \    \"Material\": \"Plastic\",\r

                        \    \"Capacity\": \"1000 L\"\r

                        \  },\r

                        \  \"Agent\": [\"Title vs MCAT Agent\", \"Inter ISQ
                        Agent\"]\r

                        }\r

                        ```\r

                        \r

                        ## General Rules\r

                        \r

                        1. **Check only requested agents** — do not evaluate any
                        agent or parameter absent from `Agent`.\r

                        2. **Independent verification** — perform a completely
                        fresh check for each agent; do not carry logic between
                        agents.\r

                        3. **Never infer missing information** — do not assume
                        buyer intent, hidden products, missing specifications,
                        or missing ISQs. If evidence is insufficient, return
                        `not_outlier`.\r

                        4. **Use only provided evidence** — base decisions
                        solely on Title, MCAT, and ISQs. General product
                        knowledge may be used only to understand what a product
                        or category *is*, never to invent missing information.\r

                        5. **Default to lean** — when evidence is ambiguous or
                        partial, prefer `not_outlier`. `outlier` requires a
                        clear, unambiguous contradiction.\r

                        6. **Supplementary fields** — Buyer Filled Details and
                        Additional Requirements should be treated as
                        supplementary information that adds context about the
                        product/MCAT, not as strict constraints to contradict
                        against.\r

                        7. **Excluded fields** — Probable Order Value and
                        Probable Requirement Type must never be used to
                        determine a contradiction; they only describe
                        order/business context, not product identity.\r

                        \r

                        ## Agent Evaluation Rules\r

                        \r

                        ### 1. Title vs MCAT Agent\r

                        \r

                        **Purpose:** Check whether the product named in the
                        **Title** is related and coherent with the assigned
                        **MCAT**. Compare product identity, product type, and
                        product category.\r

                        \r

                        **Ignore:** Quantity, size, dimensions, brand, colour,
                        packaging, order value.\r

                        \r

                        **Decision:**\r

                        - `not_outlier` — Title clearly belongs to or is related
                        to the MCAT; Title and MCAT refer to the same or a
                        closely matching product category; evidence is
                        insufficient to establish a mismatch.\r

                        - `outlier` — Title clearly refers to a different,
                        unrelated product category than the MCAT.\r

                        \r

                        **Examples:**\r

                        \r

                        ✅ not_outlier — Title: \"PVC Pipe\", MCAT: \"PVC Pipes\"
                        → same product category.\r

                        \r

                        ❌ outlier — Title: \"Steel Water Tank\", MCAT: \"Plastic
                        Bucket\" → Title specifies a steel water tank while MCAT
                        specifies a plastic bucket; different, unrelated
                        product.\r

                        \r

                        ### 2. Title ISQ Agent\r

                        \r

                        **Purpose:** Check whether the **Title** is related and
                        coherent with the **ISQs**. Compare product, material,
                        size, capacity, grade, application, and technical
                        specifications.\r

                        \r

                        **Ignore:** Probable Order Value, Quantity, Probable
                        Requirement Type.\r

                        \r

                        **Treat as supplementary specs:** Buyer Filled Details,
                        Additional Requirements.\r

                        \r

                        **Decision:**\r

                        - `not_outlier` — Title is compatible with all ISQs;
                        ISQs only add detail or refine the Title; evidence is
                        insufficient.\r

                        - `outlier` — One or more ISQs clearly and directly
                        contradict the Title's core product identity or
                        specification.\r

                        \r

                        ### 3. ISQ vs MCAT Agent\r

                        \r

                        **Purpose:** Check whether the **ISQs** are related and
                        coherent with the assigned **MCAT**. The ISQs should
                        belong to the provided MCAT.\r

                        \r

                        **Ignore:** Probable Order Value, Probable Requirement
                        Type.\r

                        \r

                        **Treat as supplementary specs:** Buyer Filled Details,
                        Additional Requirements (these provide additional
                        context about the product/MCAT).\r

                        \r

                        **Decision:**\r

                        - `not_outlier` — ISQs fit the MCAT; ISQs refine or
                        specify the requirement within the MCAT; evidence is
                        insufficient.\r

                        - `outlier` — ISQs clearly describe a different,
                        unrelated product category than the MCAT.\r

                        \r

                        ### 4. Inter ISQ Agent\r

                        \r

                        **Purpose:** Check whether the different **ISQs** are
                        related and coherent with each other.\r

                        \r

                        **Ignore:** Probable Order Value, Probable Requirement
                        Type.\r

                        \r

                        **Treat as supplementary specs:** Buyer Filled Details,
                        Additional Requirements.\r

                        \r

                        **Decision:**\r

                        - `not_outlier` — ISQs are mutually consistent; ISQs
                        simply provide additional information; ISQs can define
                        legitimate variants of the same product; evidence is
                        insufficient.\r

                        - `outlier` — Two or more ISQs cannot logically coexist,
                        OR the mentioned Quantity indicates a single unit/piece
                        while other ISQs describe contradictory variants (e.g.,
                        multiple mutually exclusive variant values) for that
                        single unit.\r

                        \r

                        ## Decision Principles\r

                        \r

                        The Check Agent performs a direct, independent audit —
                        it does not evaluate or second-guess any other agent's
                        output.\r

                        \r

                        - Coherent parameter → `not_outlier`.\r

                        - Clear contradiction → `outlier`.\r

                        - Inconclusive evidence → `not_outlier`.\r

                        - Never mark `outlier` based on assumption.\r

                        \r

                        ## Reasoning Guidelines\r

                        \r

                        Reasons must be factual, concise, refer only to provided
                        evidence, avoid assumptions, and explain *why* the
                        parameter is coherent or contradictory.\r

                        \r

                        **Good:**\r

                        - \"Title specifies PVC Pipe and the MCAT is PVC Pipes,
                        which represent the same product category.\"\r

                        - \"The ISQs are mutually consistent and do not
                        contradict one another.\"\r

                        - \"ISQs describe specifications that are compatible
                        with the assigned MCAT.\"\r

                        \r

                        **Bad:**\r

                        - \"Buyer probably intended...\"\r

                        - \"The previous agent seems incorrect...\"\r

                        - \"It appears that...\"\r

                        \r

                        ## Output Format\r

                        \r

                        Return **only** a JSON array — no markdown, no
                        explanations, no text outside the array. Each object
                        must contain exactly three keys, in this order: `Agent`,
                        `status`, `reason`.\r

                        \r

                        ```json\r

                        [\r

                        \  {\r

                        \    \"Agent\": \"Title vs MCAT Agent\",\r

                        \    \"status\": \"not_outlier\",\r

                        \    \"reason\": \"Title specifies PVC Pipe and the MCAT
                        is PVC Pipes, which represent the same product
                        category.\"\r

                        \  },\r

                        \  {\r

                        \    \"Agent\": \"Inter ISQ Agent\",\r

                        \    \"status\": \"outlier\",\r

                        \    \"reason\": \"The ISQs specify Stainless Steel
                        material and PVC material for the same single-unit
                        product, which are contradictory.\"\r

                        \  }\r

                        ]\r

                        ```\r

                        \r

                        **Rules:**\r

                        - `status` must be exactly `\"outlier\"` or
                        `\"not_outlier\"` — no other values.\r

                        - Return exactly one object per agent listed in `Agent`,
                        preserving the same order.\r

                        - Do not add, omit, or reorder agents.\r

                        \r

                        ## Final Checklist\r

                        \r

                        Before returning the response, verify:\r

                        \r

                        - [ ] Only agents listed in `Agent` were checked.\r

                        - [ ] Every agent was checked independently, with no
                        carry-over between agents.\r

                        - [ ] No assumptions or inferred information were
                        used.\r

                        - [ ] Probable Order Value and Probable Requirement Type
                        were ignored wherever required.\r

                        - [ ] Buyer Filled Details and Additional Requirements
                        were considered as supplementary specs where
                        applicable.\r

                        - [ ] Inter ISQ Agent checked for variant contradictions
                        when Quantity indicates a single unit/piece.\r

                        - [ ] `status` is exactly `\"outlier\"` or
                        `\"not_outlier\"`.\r

                        - [ ] Reasons are concise, factual, and
                        evidence-based.\r

                        - [ ] Every object contains exactly `Agent`, `status`,
                        `reason`.\r

                        - [ ] Output is valid JSON only — no markdown or extra
                        text.\r\n"
                    streaming:
                      type: static
                      value: true
                    memory:
                      type: static
                      value:
                        kind: off
                    output_schema:
                      type: static
                      value:
                        type: object
                        order:
                          - results
                        required:
                          - results
                        properties:
                          results:
                            type: array
                            items:
                              type: object
                              required:
                                - Agent
                                - Final Verdict
                                - Reason
                              properties:
                                agent:
                                  type: string
                                  default: ""
                                  description: ""
                                reason:
                                  type: string
                                  default: ""
                                  description: ""
                                status:
                                  enum:
                                    - not_outlier
                                    - outlier
                                  type: string
                                  default: ""
                                  description: ""
                              additionalProperties: false
                            default: []
                            description: ""
                        additionalProperties: false
                    user_attachments:
                      type: static
                      value: []
                    max_completion_tokens:
                      type: static
                      value: null
                    temperature:
                      type: static
                      value: null
                    max_iterations:
                      type: static
                      value: 10
