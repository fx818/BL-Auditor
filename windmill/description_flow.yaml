summary: BLAuditor_Desc_Agent
description: ""
value:
  modules:
    - id: audit_description
      value:
        type: aiagent
        tools: []
        input_transforms:
          provider:
            type: static
            value:
              kind: customai
              model: google/gemini-2.5-flash-lite
              resource: $res:u/anuragupadhyay2/inspirational_customai
          output_type:
            type: static
            value: text
          user_message:
            expr: "`MCAT: ${flow_input.mcat_name || 'Unknown'}\\nItem:
              ${flow_input.item_name || ''}\\nDescription:
              ${flow_input.description || ''}`"
            type: javascript
          system_prompt:
            type: static
            value: "# Description-vs-Title / MCAT Coherence Auditor\r

              ### IndiaMart BuyLeads\r

              \r

              ---\r

              \r

              You are a Description-vs-Title/MCAT coherence auditor for
              IndiaMart BuyLeads.\r

              \r

              Your job: given a BuyLead's MCAT name, item title, and the
              buyer-supplied free-text description, classify whether the
              **description is related to, coherent with, or consistent with the
              title and MCAT**. You do NOT judge whether the buyer is genuine,
              whether the price is fair, whether ISQs are coherent, or whether
              the lead is retail vs. wholesale — those are handled by other
              agents. You judge **only** whether the description text is
              reasonably related to the same product family, product category,
              or use-case as the title and MCAT.\r

              \r

              ---\r

              \r

              ## Inputs\r

              \r

              You receive:\r

              - `MCAT` — the IndiaMart product category (e.g. \"Roof Heat
              Insulation Materials\").\r

              - `Item` — the buyer's free-text item title.\r

              - `Description` — the buyer's free-text product description (may
              be empty, may be short, may be long).\r

              \r

              ---\r

              \r

              ## Empty Description — Short-Circuit\r

              \r

              If `Description` is empty or whitespace-only, this is a `Not
              Available` case internally, which maps to `not_outlier`. Output
              exactly this and stop. Do not run any further analysis:\r

              \r

              ```json\r

              {\"status\": \"not_outlier\", \"reason\": \"No description
              present.\"}\r

              ```\r

              \r

              ---\r

              \r

              ## Internal Classification — Determine One of Three Cases\r

              \r

              Before producing final output, internally determine which of these
              three cases applies. This internal classification is what drives
              your reasoning — it is not part of the final output schema, but it
              is the basis for the `reason` you write.\r

              \r

              | Internal case | When to use it |\r

              |---|---|\r

              | `Correct` | **The default.** The description is related to,
              coherent with, or consistent with the title/MCAT. This includes:
              same product family, a related product within the same broad
              category, a use-case or application of the title product, a search
              term that implies the title product, or a broader/narrower
              category that contains the title product. Minor stylistic
              differences, marketing fluff, missing detail, or extra unrelated
              noise do NOT disqualify a lead from `Correct`. |\r

              | `Incorrect` | The description is about a **clearly and grossly
              different** product category with no plausible connection to the
              title/MCAT (e.g. title \"MS Pipe\", description \"Used iPhone for
              sale\"). Also applies when the description is structural garbage
              (random characters, single punctuation, repeated `asdf`-style
              text, or contains nothing but boilerplate like \"contact me on
              whatsapp\" with zero product mention). |\r

              | `Not Available` | The description is empty or whitespace-only —
              no content was provided. (Handled by the short-circuit above; you
              should not reach this case otherwise.) |\r

              \r

              ---\r

              \r

              ## Default Stance — Lean Strongly Towards `Correct` /
              `not_outlier`\r

              \r

              You are an auditor, not a critic. Most BuyLeads will be
              `not_outlier`. The bar for `outlier` is **gross mismatch** — a
              product family with no plausible connection to the title/MCAT.
              When in doubt between `Correct` and `Incorrect`, always choose
              `Correct` (i.e. `not_outlier`).\r

              \r

              ---\r

              \r

              ## Broad Coherence — What Counts as \"Related\"\r

              \r

              Think expansively. A description is coherent with the title/MCAT
              (i.e. `Correct` → `not_outlier`) if it falls into **any** of these
              categories:\r

              \r

              **1. Same product family**\r

              Steel Pipe ↔ MS Pipe ↔ ERW Pipe ↔ GI Pipe → all same family.\r

              \r

              **2. Same product, different variant, grade, or size**\r

              AAA Battery ↔ AA Battery ↔ Battery (generic) → all coherent.\r

              \r

              **3. Related product in the same broad category**\r

              - Mobile Accessories ↔ Mobile Phones → same electronics/mobile
              category → `Correct`\r

              - Air Conditioner ↔ Portable Air Cooler → both cooling appliances
              → `Correct`\r

              \r

              **4. Use-case or application mention**\r

              - \"Electrical use\" for \"Promotional Canvas Bags\" → `Correct`\r

              - \"Agriculture\" for \"Mustard Oil Cake\" → `Correct`\r

              \r

              **5. \"Buyer searched for X\" phrasing**\r

              Evaluate whether the searched term is related to the title/MCAT,
              not whether it is identical.\r

              \r

              **6. Quantity-only descriptions**\r

              \"Need 500 kg per month\" → always `Correct` if quantity can be
              associated with the title product.\r

              \r

              **7. Title product explicitly mentioned alongside unrelated
              products**\r

              Ambiguous but still `Correct`.\r

              \r

              ---\r

              \r

              ## Status Mapping — Internal Case to Final Output\r

              \r

              | Internal case | Final `status` |\r

              |---|---|\r

              | `Correct` | `not_outlier` |\r

              | `Not Available` | `not_outlier` |\r

              | `Incorrect` | `outlier` |\r

              \r

              Only an `Incorrect` (gross mismatch or structural garbage)
              internal classification results in `outlier`. Everything else —
              including all shades of `Correct` and the empty-description case —
              is `not_outlier`.\r

              \r

              ---\r

              \r

              ## Output Contract — Strict JSON\r

              \r

              Return a SINGLE JSON object with exactly these keys, no markdown
              fences, no prose before or after:\r

              \r

              ```json\r

              {\r

              \  \"status\": \"outlier\" | \"not_outlier\",\r

              \  \"reason\": \"<1-3 sentences explaining the classification>\"\r

              }\r

              ```\r

              \r

              - For `not_outlier` derived from a clean `Correct` match, keep
              `reason` short and direct (e.g. \"Description describes the same
              product family as the title/MCAT.\").\r

              - For `not_outlier` derived from a thin, partial, or inferred
              match, note the ambiguity in `reason` (e.g. \"Description only
              mentions a use-case, but it plausibly applies to the title
              product.\").\r

              - For `outlier`, `reason` must state what the description actually
              describes and why it has no plausible connection to the title/MCAT
              (e.g. \"Description refers to a used iPhone, which has no relation
              to MS Pipe.\").\r

              - For the empty-description short-circuit, `reason` is always
              exactly `\"No description present.\"`\r

              - Output JSON ONLY. No markdown code fences, no leading/trailing
              prose, no additional keys (no `score`, `confidence`, or
              `issues`).\r\n"
          streaming:
            type: static
            value: true
          memory:
            type: static
            value:
              kind: off
          output_schema:
            type: static
            value:
              type: object
              order:
                - status
                - reason
              $schema: https://json-schema.org/draft/2020-12/schema
              required:
                - status
                - reason
              properties:
                reason:
                  type: string
                  default: No description present.
                  description: ""
                status:
                  enum:
                    - outlier
                    - not_outlier
                  type: string
                  default: not_outlier
                  description: ""
          user_attachments:
            type: static
            value: []
          max_completion_tokens:
            type: static
            value: null
          temperature:
            type: static
            value: null
          max_iterations:
            type: static
            value: 10
      summary: Audit description coherence via AI Agent
      continue_on_error: true
    - id: normalize_description
      value:
        lock: |
          # py: 3.12
        type: rawscript
        content: >-
          import json



          _FALLBACK = {
              "status": "error",
              "reason": "Description audit agent failed or returned unexpected output.",
          }


          _VALID_STATUS = {"outlier", "not_outlier"}



          def _normalize_obj(d: dict) -> dict:
              # Support both "reason" and "reasoning"
              reason = d.get("reason") or d.get("reasoning") or ""

              status = str(d.get("status", "")).strip().lower()

              if status not in _VALID_STATUS:
                  return _FALLBACK

              return {
                  "status": status,
                  "reason": reason,
              }


          def _parse_str(text: str):
              if not text:
                  return None

              s = text.strip().replace("```json", "").replace("```", "").strip()

              # Try direct JSON parsing
              try:
                  parsed = json.loads(s)
                  if isinstance(parsed, dict):
                      return parsed
              except Exception:
                  pass

              # Try extracting the first balanced JSON object
              start = s.find("{")
              if start == -1:
                  return None

              depth = 0
              in_string = False
              escape = False

              for i in range(start, len(s)):
                  ch = s[i]

                  if in_string:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == '"':
                          in_string = False
                      continue

                  if ch == '"':
                      in_string = True
                  elif ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          candidate = s[start:i + 1]
                          try:
                              parsed = json.loads(candidate)
                              if isinstance(parsed, dict):
                                  return parsed
                          except Exception:
                              return None

              return None


          def _extract_payload(audit_result):
              """
              Extract the actual model output from the aiagent wrapper.
              """
              if isinstance(audit_result, dict):
                  return audit_result.get("output", audit_result)
              return audit_result


          def main(audit_result):
              payload = _extract_payload(audit_result)

              if isinstance(payload, dict):
                  return _normalize_obj(payload)

              if isinstance(payload, str):
                  parsed = _parse_str(payload)
                  if parsed is not None:
                      return _normalize_obj(parsed)
                  return _FALLBACK

              return _FALLBACK
        language: python3
        input_transforms:
          audit_result:
            expr: results.audit_description
            type: javascript
      summary: Normalize aiagent output; fill missing fields; safe fallback on error
    - id: resolve_buyer_activity
      value:
        lock: |-
          # workspace-dependencies-mode: manual
          # py: 3.12
          anyio==4.14.2
          certifi==2026.6.17
          h11==0.16.0
          httpcore==1.0.9
          httpx==0.28.1
          idna==3.18
          python-dateutil==2.9.0.post0
          six==1.17.0
          typing-extensions==4.16.0
        type: rawscript
        content: >
          # requirements:

          # httpx

          # python-dateutil


          import asyncio

          import base64

          import json

          import re

          import os

          import urllib.parse

          from collections import Counter

          from datetime import datetime, timedelta

          from urllib.parse import unquote


          import httpx

          from dateutil import parser as _dateutil_parser


          _RC4_KEY = "1996c39iil"

          _ACTIVITY_KEYWORD_IDS = {1282, 559, 548, 4231}

          _TERM_STOPWORDS = {"a", "an", "the", "and", "or", "for", "of", "to",
          "with", "in"}



          def _rc4(data: bytes, key: str) -> bytes:
              s = list(range(256))
              kb = key.encode()
              j = 0
              for i in range(256):
                  j = (j + s[i] + kb[i % len(kb)]) % 256
                  s[i], s[j] = s[j], s[i]
              i = j = 0
              out = bytearray()
              for byte in data:
                  i = (i + 1) % 256
                  j = (j + s[i]) % 256
                  s[i], s[j] = s[j], s[i]
                  k = s[(s[i] + s[j]) % 256]
                  out.append(byte ^ k)
              return bytes(out)


          def _decrypt_glid(enc: str) -> str:
              return _rc4(base64.b64decode(urllib.parse.unquote(enc)), _RC4_KEY).decode()


          def _window(ofr_date: str = "", eto_ofr_date: str = "") -> tuple:
              """
              Compute (logtime, endlogtime) for the buyer-activity lookup window.

              ofr_date: expected as a 14-digit YYYYMMDDHHMMSS string (precise timestamp).
              eto_ofr_date: fallback, any date string dateutil can parse.
              If neither is usable, falls back to "now".
              """
              raw = str(ofr_date or "").strip()
              inst, precise = None, False
              if len(raw) == 14 and raw.isdigit():
                  try:
                      inst, precise = datetime.strptime(raw, "%Y%m%d%H%M%S"), True
                  except ValueError:
                      pass
              if inst is None:
                  od = str(eto_ofr_date or "").strip()
                  if od:
                      try:
                          inst = _dateutil_parser.parse(od)
                      except Exception:
                          pass
              if inst is None:
                  now = datetime.now()
                  return now.strftime("%Y%m%d%H%M%S"), (now - timedelta(days=2)).strftime("%Y%m%d%H%M%S")
              logtime = inst.strftime("%Y%m%d%H%M%S") if precise else inst.strftime("%Y%m%d") + "235959"
              endlogtime = (inst - timedelta(days=2)).strftime("%Y%m%d") + "000000"
              return logtime, endlogtime


          def _clean(v):
              return None if v in (None, "-", "[-]", 0, "0", "") else v


          def _first_str(v):
              if isinstance(v, list):
                  for x in v:
                      if x not in (None, "", "-", 0):
                          return x
                  return None
              return _clean(v)


          def _fmt_dt(raw):
              s = str(raw)
              if len(s) == 14 and s.isdigit():
                  return f"{s[:4]}-{s[4:6]}-{s[6:8]} {s[8:10]}:{s[10:12]}:{s[12:14]}"
              return s


          def _parse_activity(response: dict, glusr_id: str = "") -> dict:
              code = response.get("CODE")
              message = response.get("MESSAGE") or response.get("message") or ""
              details = response.get("DETAILS")
              out = {
                  "ok": False, "status": "SUCCESS" if code == 200 else "ERROR",
                  "code": code, "message": message, "error": None, "events": [],
                  "type_counts": {}, "summary": {},
              }
              if code != 200 or not isinstance(details, list) or not details:
                  out["error"] = message or "No activity data returned."
                  return out
              events, type_counts, cities = [], Counter(), Counter()
              for r in details:
                  if not isinstance(r, dict):
                      continue
                  dt = str(r.get("datetime", ""))
                  atype = r.get("activity_type") or "—"
                  kw = _clean(r.get("keyword"))
                  if isinstance(kw, str):
                      kw = unquote(kw)
                  events.append({
                      "datetime": dt, "time_label": _fmt_dt(dt),
                      "activity_type": atype, "activity_id": r.get("fk_activity_id"),
                      "keyword": kw,
                  })
                  type_counts[atype] += 1
                  city = _first_str(r.get("location_pref_city_names"))
                  if city and isinstance(city, str):
                      cities[city] += 1
              events.sort(key=lambda e: e["datetime"], reverse=True)
              times = [e["datetime"] for e in events if e["datetime"]]
              out.update({
                  "ok": True, "events": events, "type_counts": dict(type_counts),
                  "summary": {
                      "glid": glusr_id, "total": len(events),
                      "bl_count": type_counts.get("BL", 0), "enq_count": type_counts.get("ENQ", 0),
                      "top_city": cities.most_common(1)[0][0] if cities else None,
                      "range_from": _fmt_dt(min(times)) if times else None,
                      "range_to": _fmt_dt(max(times)) if times else None,
                  }
              })
              return out


          def _collect_keywords(buyer_activity: dict) -> list:
              seen, out = set(), []
              for ev in (buyer_activity or {}).get("events") or []:
                  if ev.get("activity_id") in _ACTIVITY_KEYWORD_IDS:
                      kw = str(ev.get("keyword") or "").strip()
                      if kw and kw.lower() not in seen:
                          seen.add(kw.lower())
                          out.append(kw)
              return out


          def _tokens(text: str) -> set:
              return {t for t in re.findall(r"[a-z0-9]+", (text or "").lower().replace("-", " "))
                      if t not in _TERM_STOPWORDS}


          def _match_terms(desc: str, buyer_activity: dict) -> dict:
              text = (desc or "").strip()
              prefix = "buyer searched for"
              if text.lower().startswith(prefix):
                  text = text[len(prefix):]
              terms = []
              for chunk in text.split(","):
                  term = re.sub(r"^\s*(?:and|or)\s+", "", chunk.strip(), flags=re.IGNORECASE).strip()
                  if term:
                      terms.append(term)
              log_kws = _collect_keywords(buyer_activity)
              kw_tok = [(kw, _tokens(kw)) for kw in log_kws]
              results = []
              for term in terms:
                  t_tok = _tokens(term)
                  matched = None
                  # Guard: if t_tok is empty (all stopwords / punctuation), never match anything.
                  # Without this, {} <= k_tok is True for any non-empty keyword set.
                  if t_tok:
                      for kw, k_tok in kw_tok:
                          if k_tok and (k_tok <= t_tok or t_tok <= k_tok):
                              matched = kw
                              break
                  results.append({"term": term, "found": matched is not None, "matched_keyword": matched})
              return {
                  "terms": results, "log_keywords": log_kws,
                  "found_count": sum(1 for r in results if r["found"]), "total": len(terms),
              }


          async def _run(
              enc_glid: str,
              mcat_name: str,
              description: str,
              desc_audit_raw: dict,
              ofr_date: str = "",
              eto_ofr_date: str = "",
              title: str = "",
          ) -> dict:
              mcat_name = str(mcat_name or "").strip() or "Unknown"
              desc_text = str(description or "").strip()

              # desc_audit_raw is expected to be the output of normalize_description, which
              # always returns a plain dict with a guaranteed "status" key.
              desc_status = (desc_audit_raw or {}).get("status", "") if isinstance(desc_audit_raw, dict) else ""

              enc_glid = str(enc_glid or "").strip()

              _base = {
                  "buyer_glid": None, "buyer_activity": None, "term_match": None,
                  "candidates": [], "candidates_str": "[]", "needs_keyword_selection": False,
                  "mcat_name": mcat_name, "title": title,
              }

              if not enc_glid:
                  return {**_base, "error": "No encrypted GLID provided"}

              try:
                  buyer_glid = _decrypt_glid(enc_glid)
              except Exception as exc:
                  return {**_base, "error": f"GLID decrypt failed: {exc}"}

              logtime, endlogtime = _window(ofr_date, eto_ofr_date)
              base_url = "http://10.142.0.9"
              api_url = f"{base_url}/ImBuyerActivity/GetData"
              ak = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjIzMDAiLCJleHAiOjE3ODQxNzk0MTUsImlhdCI6MTc4NDA5MzAxNSwiaXNzIjoiRU1QTE9ZRUUifQ.nORDOfYiKAQdyCT7P3nr53Cb45VUAo0sWsh9MiR2eS4"
              max_retries = int(os.getenv("BUYER_ACTIVITY_MAX_RETRIES", "2"))

              ba_raw, last_exc = None, None
              for attempt in range(1, max_retries + 2):
                  try:
                      async with httpx.AsyncClient(timeout=60.0) as client:
                          resp = await client.get(api_url, params={
                              "glusrId": buyer_glid, "logtime": logtime,
                              "endlogtime": endlogtime, "AK": ak,
                          })
                          resp.raise_for_status()
                          ba_raw = resp.json()
                          break
                  except Exception as exc:
                      last_exc = exc
                      if attempt <= max_retries:
                          await asyncio.sleep(2 ** (attempt - 1))

              if ba_raw is None:
                  return {**_base, "buyer_glid": buyer_glid,
                          "error": f"Activity fetch failed: {last_exc}"}

              buyer_activity = _parse_activity(ba_raw, glusr_id=buyer_glid)
              candidates, term_match, needs_kw = [], None, False

              # Always collect candidates and run term_match for "buyer searched for" descriptions
              # so downstream steps have full observability. Only flag for keyword replacement
              # when the description audit explicitly says Incorrect.
              if desc_text.lower().startswith("buyer searched for") and buyer_activity.get("ok"):
                  candidates = _collect_keywords(buyer_activity)
                  term_match = _match_terms(desc_text, buyer_activity)
                  needs_kw = bool(candidates) and desc_status == "Incorrect"

              return {
                  "buyer_glid": buyer_glid,
                  "buyer_activity": buyer_activity,
                  "term_match": term_match,
                  "candidates": candidates,
                  "candidates_str": json.dumps(candidates, ensure_ascii=False),
                  "needs_keyword_selection": needs_kw,
                  "mcat_name": mcat_name,
                  "title": title,
                  "error": None,
              }


          def main(
              enc_glid: str,
              mcat_name: str,
              description: str,
              desc_audit_raw: dict,
              ofr_date: str = "",
              eto_ofr_date: str = "",
              title: str = "",
          ) -> dict:
              """
              Direct-input version -- no buylead_response/offer objects required.

              Args:
                  enc_glid: encrypted GLID string (e.g. FK_GLUSR_USR_ID from a BuyLead).
                  mcat_name: category name for the offer.
                  description: the offer/buylead description text (used to detect the
                      "buyer searched for ..." pattern and drive keyword matching).
                  desc_audit_raw: output of the description-normalization step, a dict
                      with at least a "status" key (e.g. {"status": "Incorrect"}).
                  ofr_date: optional 14-digit YYYYMMDDHHMMSS timestamp used to build the
                      activity lookup window. Falls back to eto_ofr_date, then now().
                  eto_ofr_date: optional fallback date string (any format dateutil can
                      parse) if ofr_date isn't available/precise.
                  title: optional offer title, passed through in the output for
                      downstream steps (not currently used in any matching logic here).
              """
              return asyncio.run(_run(
                  enc_glid=enc_glid,
                  mcat_name=mcat_name,
                  description=description,
                  desc_audit_raw=desc_audit_raw,
                  ofr_date=ofr_date,
                  eto_ofr_date=eto_ofr_date,
                  title=title,
              ))
        language: python3
        input_transforms:
          title:
            expr: flow_input.item_name
            type: javascript
          enc_glid:
            expr: flow_input.glid
            type: javascript
          ofr_date:
            expr: flow_input.ofr_date
            type: javascript
          mcat_name:
            expr: flow_input.mcat_name
            type: javascript
          description:
            expr: flow_input.description
            type: javascript
          eto_ofr_date:
            expr: flow_input.eto_ofr_date
            type: javascript
          desc_audit_raw:
            expr: results.normalize_description
            type: javascript
      summary: " buyer activity"
    - id: keyword_selection
      value:
        type: branchone
        default:
          - id: skip_keywords
            value:
              lock: |
                # py: 3.12
              type: rawscript
              content: >-
                def main() -> dict:
                    return {"keywords": [], "reason": "Not applicable", "error": None}
              language: python3
              input_transforms: {}
            summary: Skip keyword selection — condition not met
        branches:
          - expr: results.normalize_description.status === 'outlier'
            modules:
              - id: select_keywords
                value:
                  type: aiagent
                  tools: []
                  input_transforms:
                    provider:
                      type: static
                      value:
                        kind: customai
                        model: google/gemini-2.5-flash-lite
                        resource: $res:u/anuragupadhyay2/inspirational_customai
                    output_type:
                      type: static
                      value: text
                    user_message:
                      expr: JSON.stringify(results.resolve_buyer_activity)
                      type: javascript
                    system_prompt:
                      type: static
                      value: >-
                        You are a keyword relevance selector for IndiaMart
                        BuyLeads.


                        You are given an MCAT (product category) and a list of
                        buyer search keywords extracted from their activity log.
                        Your task: select the keywords most relevant to the
                        MCAT.


                        Rules:

                        - Select at most 5 keywords. Fewer is fine if only a few
                        are relevant.

                        - Prefer keywords that are the same product, a variant,
                        or a closely related product in the same category.

                        - If none are relevant, return an empty list.

                        - Output a single JSON object only — no markdown, no
                        prose.


                        Output contract:

                        {"keywords": ["keyword1", "keyword2"], "reason": "one
                        sentence explaining the selection"}
                    streaming:
                      type: static
                      value: true
                    memory:
                      type: static
                      value:
                        kind: off
                    output_schema:
                      type: static
                      value: null
                    user_attachments:
                      type: static
                      value: []
                    max_completion_tokens:
                      type: static
                      value: null
                    temperature:
                      type: static
                      value: null
                    max_iterations:
                      type: static
                      value: 10
                summary: Pick top MCAT-relevant keywords from buyer activity via AI Agent
                continue_on_error: true
              - id: normalize_keywords
                value:
                  lock: |
                    # py: 3.12
                  type: rawscript
                  content: >-
                    import json



                    _FALLBACK = {"keywords": [], "reason": "Keyword selection
                    agent failed.", "error": "aiagent_error"}



                    def _extract_payload(kw_result):
                        # Same wrapper shape as normalize_description's input: the aiagent
                        # module's raw result is {"usage": {...}, "output": "<model text>",
                        # "messages": [...], "wm_stream": "..."}. The actual keyword-selection
                        # JSON lives inside "output", not the wrapper itself.
                        if isinstance(kw_result, dict):
                            if "output" in kw_result:
                                return kw_result.get("output")
                            return kw_result
                        return kw_result


                    def _parse_str(text: str):
                        if not text:
                            return None
                        s = text.strip().replace("```json", "").replace("```", "").strip()
                        try:
                            parsed = json.loads(s)
                            if isinstance(parsed, dict):
                                return parsed
                        except Exception:
                            pass
                        return None


                    def main(kw_result) -> dict:
                        payload = _extract_payload(kw_result)

                        if isinstance(payload, dict):
                            if "keywords" not in payload:
                                return _FALLBACK
                            kws = payload.get("keywords")
                            if isinstance(kws, str):
                                try:
                                    kws = json.loads(kws)
                                except Exception:
                                    kws = []
                            return {"keywords": kws or [], "reason": payload.get("reason", ""), "error": None}

                        if isinstance(payload, str):
                            parsed = _parse_str(payload)
                            if parsed is not None:
                                return {"keywords": parsed.get("keywords", []), "reason": parsed.get("reason", ""), "error": None}

                        return _FALLBACK
                  language: python3
                  input_transforms:
                    kw_result:
                      expr: results.select_keywords
                      type: javascript
                summary: "Fallback: normalize keyword selection output or return safe error
                  default"
            summary: Buyer searched for + Incorrect — run keyword selection
            parallel: true
            skip_failure: true
      summary: Select top activity keywords relevant to MCAT (conditional)
    - id: finalize
      value:
        lock: |
          # py: 3.12
        type: rawscript
        content: >-
          import json

          from typing import Any



          def main(
              offer_id: str,
              description_audit: dict,
              buyer_activity_info: Any,
              keyword_selection: dict,
          ) -> dict:
              ba = buyer_activity_info or {}
              if isinstance(ba, str):
                  try:
                      ba = json.loads(ba)
                  except Exception:
                      ba = {"raw": ba}
              if not isinstance(ba, dict):
                  ba = {"raw": ba}

              activity = ba.get("buyer_activity") or {}
              if not isinstance(activity, dict):
                  activity = {"raw": activity}

              term_match_raw = ba.get("term_match") or {}
              terms = term_match_raw.get("terms") if isinstance(term_match_raw, dict) else []
              if not isinstance(terms, list):
                  terms = []
              matched_keywords = [
                  t.get("matched_keyword")
                  for t in terms
                  if isinstance(t, dict) and t.get("matched_keyword")
              ]

              return {
                  "description_audit": description_audit,
                  "term_match": matched_keywords,
                  "keyword_selection": keyword_selection,
              }
        language: python3
        input_transforms:
          offer_id:
            expr: flow_input.offer_id
            type: javascript
          description_audit:
            expr: results.normalize_description
            type: javascript
          keyword_selection:
            expr: results.keyword_selection
            type: javascript
          buyer_activity_info:
            expr: results.resolve_buyer_activity
            type: javascript
      summary: Assemble final flow output
  concurrent_limit: 4
  concurrency_time_window_s: 0
